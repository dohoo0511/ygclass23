<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>친구랑 파티 게임</title>
  <meta name="description" content="방 코드 하나로 친구들과 바로 즐기는 실시간 미니 게임 모음">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" class="screen">
    <div class="hero">
      <div class="logo">🎲</div>
      <h1>친구랑 파티 게임</h1>
      <p class="sub">방 코드를 나누고 바로 같이 놀아요. 설치도, 가입도 없어요.</p>
    </div>
    <div class="card home-card">
      <label class="field">
        <span>내 이름</span>
        <input id="name" maxlength="12" placeholder="닉네임 (12자까지)" autocomplete="nickname">
      </label>
      <button id="create" class="btn primary big">✨ 새 방 만들기</button>
      <div class="or"><span>또는</span></div>
      <form id="join-form" class="join">
        <input id="code" maxlength="4" placeholder="방 코드" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn">들어가기</button>
      </form>
    </div>
    <section class="card">
      <h2>들어 있는 게임</h2>
      <ul id="game-list" class="game-list"></ul>
    </section>
  </main>

  <main id="room" class="screen" hidden>
    <header class="topbar">
      <button id="leave" class="btn ghost small" title="방 나가기">← 나가기</button>
      <div class="code-box">
        <span class="label">방 코드</span>
        <strong id="room-code">----</strong>
      </div>
      <button id="share" class="btn small">🔗 초대 링크</button>
    </header>
    <div id="conn-banner" class="banner" hidden>연결이 끊겼어요. 다시 연결하는 중…</div>
    <div class="layout">
      <section id="stage" class="stage"></section>
      <aside class="side">
        <div class="card">
          <h3>참가자 <span id="player-count" class="muted"></span></h3>
          <ul id="players" class="players"></ul>
        </div>
        <div class="card chat">
          <h3>채팅</h3>
          <ul id="chat-log" class="chat-log"></ul>
          <form id="chat-form" class="chat-form">
            <input id="chat-input" maxlength="200" placeholder="메시지 보내기" autocomplete="off">
            <button class="btn small">보내기</button>
          </form>
        </div>
      </aside>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
